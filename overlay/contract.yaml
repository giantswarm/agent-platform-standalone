# The umbrella's input contract, merged by hack/curate.sh on top of the
# transformed fleet defaults before overlay/vanilla.yaml: opinionated defaults
# for the global.* identity keys the fleet leaves empty, the umbrella-only
# keys, and the wiring the umbrella templates need inside component blocks.
# Every installation keeps these; examples/giantswarm.yaml never reverts them.
# Only umbrella-owned keys and dependency names are allowed at the top level.

global:
  identity:
    # OAuth client registered at the provider for the platform. The fleet
    # ships no default; one shared convention keeps the muster consistency
    # check, the examples and the prerequisites manifest aligned.
    clientId: agent-platform
    # Secret in the release namespace with the platform credentials:
    #   dex-client-secret, registration-token, oauth-encryption-key,
    #   valkey-password           muster and valkey
    #   backstage-session-secret  Backstage cookie signing key
    existingSecret: agent-platform-idp
    # CA of a provider with a private certificate (the lab Dex). Mounted into
    # Backstage (NODE_EXTRA_CA_CERTS). muster reads the same Secret through
    # muster.muster.extraCaFile.secret.name. Empty: system trust only.
    ca:
      secretName: ""
      key: ca.crt

components:
  # The standalone chart's product default is the FULL platform: an install
  # that provides the required inputs (global.domain, global.identity, the
  # public Gateway) gets muster, kagent, agentgateway, Backstage and
  # mcp-kubernetes without per-component toggles (decision 2026-08-31). The
  # fleet keeps these off — enablement is per-MC config there — so the
  # umbrella overrides the transformed fleet defaults here. agentgateway on
  # requires ingress.mode agentgateway-muster and
  # agent-platform-mcps.agentgateway.viaMuster true (guard-enforced), set
  # below in the same spirit.
  kagent:
    enabled: true
  agentgateway:
    enabled: true
  agent-platform-mcps:
    enabled: true
  backstage:
    # Public hostname; empty derives backstage.<global.domain>.
    hostname: ""
    # Gateway of the Backstage route; empty follows the platform default.
    parentRefs: []
    # Extra OIDC scopes the Backstage login requests. The two defaults are
    # Dex cross-client scopes: muster trusts the dex-k8s-authenticator
    # audience on forwarded tokens. Set [] for a provider that rejects unknown
    # scopes (Keycloak, Entra ID).
    extraScopes:
      - federated:id
      - audience:server:client_id:dex-k8s-authenticator
    # Extra query parameters on the login provider's authorize request
    # (the oidc authenticator's startUrlSearchParams). Dex needs none.
    # Google models offline access as authorize parameters, not as the
    # offline_access scope (which it rejects), so a Google IdP needs
    #   access_type: offline   # a refresh token is issued at all
    #   prompt: consent        # ... on every login, not only the first
    #                          # grant; without it a browser logging in
    #                          # after the first grant gets no refresh
    #                          # token and every page reload forces a
    #                          # fresh login
    # A `prompt` set here wins over the provider's default `prompt: auto`.
    # Spec-conforming providers ignore parameters they don't know.
    startUrlSearchParams: {}
    # Portal extensions to enable on top of the Agent Platform pages. Some
    # portal pages are off by default in the Backstage app itself (Deployments,
    # Clusters, Installations), so dropping them from disabledExtensions is not
    # enough to show them -- list them here instead. Example, HelmRelease
    # visibility for the agent create flow's "Go to the deployment" link
    # (Deployments links to cluster details, so enable both):
    #   - page:gs/deployments
    #   - nav-item:gs/deployments
    #   - page:gs/clusters
    #   - nav-item:gs/clusters
    # An extension listed here and in disabledExtensions ends up enabled.
    enabledExtensions: []
    # Sidebar pages of the Giant Swarm portal hidden on the vanilla UI.
    disabledExtensions:
      - page:gs/clusters
      - nav-item:gs/clusters
      - page:gs/deployments
      - nav-item:gs/deployments
      - page:gs/installations
      - nav-item:gs/installations
      - page:flux
      - nav-item:flux
      - page:ai-chat
      - api:ai-chat/service
      - api:ai-chat/drawer
      - app-root-element:ai-chat/drawer
    # Skill repositories offered when an agent is created.
    skillsRepositories:
      - https://github.com/giantswarm/agent-skills
    # Release of giantswarm/backstage-catalogs whose hidden agent-deployment
    # scaffolder template the app-config registers as a catalog location. The
    # agent create flow's deploy step runs that template; without the location
    # the step fails with "Template template:default/agent-deployment not
    # found". Backstage fetches it from github.com at catalog processing time,
    # so the backend needs egress there; set version "" to skip the location
    # (agent creation then stops at the deploy step).
    catalogs:
      # repo: giantswarm/backstage-catalogs
      version: v0.6.0
    # Roll the Backstage pod when the umbrella's app-config ConfigMap changes.
    # The backstage sub-chart's own checksum annotations cover only its own
    # templates, so an app-config change (templates/backstage/app-config.yaml)
    # otherwise takes effect only on the next manual pod restart. A
    # post-install/post-upgrade hook Job stamps the rendered app-config's
    # checksum onto the Deployment's pod template — a no-op while it is
    # unchanged, a rolling update when it differs. Disable for clusters where
    # Helm hooks are unwelcome; config changes then need a manual
    # `kubectl rollout restart deployment/backstage`.
    configReload:
      enabled: true
      # kubectl runs the patch; override for mirrored registries.
      image:
        registry: gsoci.azurecr.io
        name: giantswarm/kubectl
        # registry: gsoci.azurecr.io/giantswarm/kubectl
        version: "1.33.4"
  # The bundled Kubernetes MCP server. Its own values are the mcp-kubernetes
  # chart's (`mcp-kubernetes:` block below); this block carries what the
  # umbrella renders around it: the MCPServer CR that registers it with
  # muster (templates/mcp-kubernetes/mcpserver.yaml).
  mcp-kubernetes:
    # Audience the forwarded IdP id_token must carry on top of the platform
    # client's so the kube-apiserver accepts it: with the server's OAuth on,
    # muster forwards the session's id_token byte-identical
    # (auth.forwardToken) and requests this cross-client audience at login
    # (auth.requiredAudiences), and mcp-kubernetes presents that token to the
    # apiserver (enableDownstreamOAuth) — the user's RBAC governs, not a
    # ServiceAccount's. dex-k8s-authenticator is the Dex client Giant Swarm
    # apiservers trust (the lab Dex ships it, with the platform client in its
    # trustedPeers); an apiserver that trusts another client id names it
    # here. Empty: no extra audience — a Google IdP has no cross-client
    # scopes (they fail the login with invalid_scope) and its client id IS
    # the apiserver's --oidc-client-id.
    kubernetesAudience: dex-k8s-authenticator
  # The model-manager service (Model Manager PDR phase 3; the Ollama backend
  # ADR): model inventory, pull with progress, load/unload, delete and kagent
  # ModelConfig wiring behind one REST + MCP API, per installation. Off by
  # default and inert while off. The service's own configuration — the
  # serving backend (`ollama` for a host Ollama, `kserve` for KServe/vLLM on
  # GPU installs), its endpoint, the kagent namespace it wires ModelConfigs
  # into — is the model-manager chart's and lives in the `model-manager:`
  # block below, validated by that chart's schema; the umbrella cannot
  # compute a dependency's values at render time. This block carries the
  # wiring the umbrella renders for it: the agentgateway route the portal
  # backend (agentPlatform.modelManager.installations.<release>.apiBaseUrl in
  # the Backstage app-config) reaches the API through, and the JWT policy
  # that makes the gateway the identity boundary — model-manager itself
  # checks no identity, exactly like the kagent controller behind its
  # controllerRoute. muster reaches the MCP endpoint in-cluster (the chart's
  # MCPServer CR, model-manager.muster.mcpServer), not through this route.
  # See the README section "Model manager".
  model-manager:
    # Expose the model-manager API on the agentgateway data plane at
    # https://agentgateway.<global.domain><pathPrefix>: an AgentgatewayBackend
    # for the Service, an HTTPRoute that strips the prefix (model-manager
    # then sees /api/v1/...), and — when the chart-owned edge is not the data
    # plane — the public HTTPRoute on the outer Gateway. Requires an
    # agentgateway-* ingress.mode.
    route:
      enabled: false
      pathPrefix: /model-manager
      # Public hostname; empty derives agentgateway.<global.domain> (the
      # same hostname as the kagent controller route).
      hostname: ""
      # Gateway of the public route (outer edge). Both halves or neither:
      # empty follows the chart-owned edge, else global.gatewayApi.parentRefs.
      parentRef:
        name: ""
        namespace: ""
      # Validate the bearer JWT (signature, issuer, expiry) at the gateway
      # before forwarding: no token, no API. The issuer defaults to
      # global.identity.issuerUrl; the JWKS is fetched from the issuer's
      # in-cluster endpoint through a static AgentgatewayBackend (needs
      # gateway.jwksEgress when network policies are on).
      jwtAuthentication:
        enabled: false
        mode: Strict
        issuer: ""
        jwks:
          host: dex.giantswarm.svc.cluster.local
          port: 5556
          path: /keys
          # The issuer serves its JWKS over TLS (a Dex with `web.https`):
          # originate TLS to it, verifying against the CA Secret (key
          # ca.crt); empty caSecretName uses global.identity.ca.secretName,
          # and with both empty the data plane's system trust. Off: plain
          # HTTP, the in-cluster Dex default.
          tls:
            enabled: false
            caSecretName: ""
    # The kserve backend (model-manager.backend: kserve) manages
    # InferenceServices; the render fails while the serving.kserve.io API
    # is missing and the modelServing component is off, unless this is
    # false (an offline `helm template` passes with --api-versions
    # serving.kserve.io/v1beta1).
    kserve:
      requireApi: true
  # The agent-manager service (the agent write surface of the Agent Control
  # Plane, giantswarm/giantswarm#36796): the sibling of model-manager for
  # agents. It composes a kagent agent the way the portal's create flow does
  # — a Flux HelmRelease of the agent chart plus the shared per-namespace
  # OCIRepository of that chart — validates the values against the chart's
  # values.schema.json before applying, and reads agents back from the Agent,
  # its HelmRelease and the workload; ModelConfigs and skills are listed for
  # it. Ten MCP tools (x_agent-manager_* through muster's own MCPServer CR,
  # agent-manager.muster.mcpServer) and the same REST API. On by default with
  # the platform: it needs kagent (the agents it manages) and Flux's helm and
  # source controllers on the cluster (the HelmReleases it writes — the same
  # prerequisite the portal's agent create flow has; without them an agent
  # stays "progressing" and get_agent_status says so). The service's own
  # configuration is the agent-manager chart's, in the `agent-manager:` block
  # below. This block carries the wiring the umbrella renders for it: the
  # agentgateway route a portal backend reaches the API through and the JWT
  # policy that makes the gateway the identity boundary — agent-manager itself
  # checks no identity yet and writes with its own ServiceAccount (model-manager
  # did the same until 0.13.0; since then it validates the forwarded token
  # itself and acts only as the caller — agent-manager gets the same treatment
  # in a follow-up). See the README section "Agent manager".
  agent-manager:
    # Expose the agent-manager API on the agentgateway data plane at
    # https://agentgateway.<global.domain><pathPrefix>: an AgentgatewayBackend
    # for the Service, an HTTPRoute that strips the prefix (agent-manager then
    # sees /api/v1/...), and — when the chart-owned edge is not the data
    # plane — the public HTTPRoute on the outer Gateway. Off by default: the
    # MCP tools reach muster in-cluster without it; turn it on for a portal
    # or CLI that calls the REST API. Requires an agentgateway-* ingress.mode.
    route:
      enabled: false
      pathPrefix: /agent-manager
      # Public hostname; empty derives agentgateway.<global.domain>.
      hostname: ""
      # Gateway of the public route (outer edge). Both halves or neither:
      # empty follows the chart-owned edge, else global.gatewayApi.parentRefs.
      parentRef:
        name: ""
        namespace: ""
      # Validate the bearer JWT (signature, issuer, expiry) at the gateway
      # before forwarding: no token, no API. The issuer defaults to
      # global.identity.issuerUrl; the JWKS is fetched from the issuer's
      # in-cluster endpoint through a static AgentgatewayBackend (needs
      # gateway.jwksEgress when network policies are on).
      jwtAuthentication:
        enabled: false
        mode: Strict
        issuer: ""
        jwks:
          host: dex.giantswarm.svc.cluster.local
          port: 5556
          path: /keys
          tls:
            enabled: false
            caSecretName: ""
    flux:
      # Fail the render when the Flux APIs agent-manager writes
      # (helm.toolkit.fluxcd.io/v2 HelmRelease, source.toolkit.fluxcd.io/v1
      # OCIRepository) are not on the cluster. Off by default because the
      # component is on by default and an offline `helm template` (lint, the
      # catalog build) never sees cluster APIs; turn it on for installs that
      # want a missing Flux to fail the upgrade instead of leaving agents
      # "progressing".
      requireApi: false
    # Network policies of the component, rendered under global.networkPolicy
    # (enabled + flavor) like every other component's wiring; nothing renders
    # while global.networkPolicy.enabled is false. Ingress: the agentgateway
    # data plane (route on), muster (MCPServer on), Backstage, and — cilium —
    # the kubelet's probes. Egress: DNS, the Kubernetes API, and 443 to the
    # agent chart's registry (derived from agent-manager.agentChart.ociUrl)
    # plus the names below.
    networkPolicy:
      egress:
        # cilium flavor: Cilium FQDN selectors (matchName, matchPattern) next
        # to the registry host, resolved through the DNS proxy rule the policy
        # renders. The defaults cover the registry's blob storage front
        # (gsoci.azurecr.io redirects downloads to *.blob.core.windows.net)
        # and the GitHub API skill discovery reads SKILL.md files from.
        # Ignored by the kubernetes flavor (see cidrs).
        fqdns:  # @schema item: object; itemProperties: {matchName: {type: string}, matchPattern: {type: string}}
          - matchPattern: "*.blob.core.windows.net"
          - matchName: api.github.com
        # IP blocks of the registry and GitHub. kubernetes flavor: vanilla
        # NetworkPolicy selects addresses, never names, so an empty list (the
        # default) opens 443 to every public destination — 0.0.0.0/0 minus
        # global.networkPolicy.kubernetes.worldExcludedCIDRs. A list here
        # narrows the egress to exactly these blocks (a mirror, a proxy). The
        # cilium flavor adds them next to the names.
        cidrs: []  # @schema item: string
  # Model serving on KServe with vLLM, for installs that run local models
  # (Model Manager PDR, decision D1: integrate KServe, do not bundle it). Off
  # by default and inert while off: nothing below renders. The umbrella
  # renders this component itself (no Helm dependency), from
  # templates/model-serving/ and the chart files under files/model-serving/.
  # KServe (its CRDs and controller) is a cluster prerequisite like the
  # Gateway API CRDs; the render fails while the component is on and the
  # serving.kserve.io API is missing (kserve.requireApi). On, the chart
  # renders: the vLLM ClusterServingRuntime every preset runs on; the curated
  # serving presets the portal's serve flow offers (one ConfigMap per preset
  # in the release namespace, label
  # agent-platform.giantswarm.io/serving-preset=true, schema in
  # files/model-serving/serving-preset.schema.json); the discovery ConfigMap
  # agent-platform-model-serving (label
  # agent-platform.giantswarm.io/model-serving-config=true) that tells the
  # portal and model-manager where InferenceServices go and how; the Hugging
  # Face cache PVC; and, with Kyverno, the admission policies that wire every
  # InferenceService pod in the serving namespace to that cache. See the
  # README section "Model serving".
  modelServing:
    enabled: false
    kserve:
      # Fail the render when the KServe CRDs (serving.kserve.io/v1alpha1
      # ClusterServingRuntime, v1beta1 InferenceService) are not on the
      # cluster, instead of shipping objects the API server rejects. An
      # offline `helm template` passes the check with
      # --api-versions serving.kserve.io/v1alpha1 --api-versions serving.kserve.io/v1beta1;
      # false skips it.
      requireApi: true
    # The namespace InferenceServices run in. The runtime is cluster-scoped;
    # the cache PVC, the chat-template ConfigMaps and the Kyverno policies
    # target this namespace, and the portal creates InferenceServices here.
    # Created by the chart (Helm-owned) when create is true and the name
    # differs from the release namespace. labels: e.g. a Pod Security
    # admission level — the upstream vLLM image runs as root, and the cache
    # init container needs root to create the per-model directory.
    namespace:
      name: model-serving
      create: true
      labels: {}  # @schema type: object; additionalProperties: true
    # The vLLM ClusterServingRuntime (serving.kserve.io/v1alpha1,
    # cluster-scoped). Every shipped preset runs on it; a preset may name
    # another runtime.
    runtime:
      name: kserve-vllm
      # The upstream x86-64 CUDA image. An install with special hardware
      # (ARM64, Blackwell sm_121) points registry/name/version at its own
      # build; the presets do not change.
      image:
        registry: docker.io
        name: vllm/vllm-openai
        # registry: docker.io/vllm/vllm-openai
        version: "v0.28.0"
      # Server arguments common to every model. KServe expands {{.Name}} to
      # the InferenceService name; a preset's args are appended by KServe.
      # The port must stay 8080 (the probe, the metrics annotations and
      # KServe's predictor Service assume it).
      args:
        - --model
        - /mnt/models
        - --port
        - "8080"
        - --served-model-name
        - "{{.Name}}"
      # Environment of the runtime container; a preset's env is merged on
      # top by KServe. VLLM_CONFIG_ROOT keeps vLLM's config writable when
      # /mnt/models is a read-only mount.
      env:  # @schema itemRef: $k8s/envvar.json
        - name: HF_HUB_ENABLE_HF_TRANSFER
          value: "1"
        - name: VLLM_CONFIG_ROOT
          value: /tmp
      # Resource envelope of the runtime container. A preset's resources win
      # field by field (KServe merges the InferenceService over the runtime);
      # the GPU count always comes from the preset.
      resources:
        requests:  # @schema type: object; additionalProperties: true
          cpu: "2"
          memory: 16Gi
        limits:  # @schema type: object; additionalProperties: true
          cpu: "8"
          memory: 64Gi
      # /dev/shm (memory-backed emptyDir) for vLLM's worker IPC.
      shmSize: 16Gi
      # Startup budget of the runtime container: loading a large model after
      # the download takes many minutes; 360 x 30s = 3 hours before KServe
      # gives up on the pod.
      startupProbe:
        initialDelaySeconds: 300
        periodSeconds: 30
        failureThreshold: 360
      # Pod annotations KServe copies onto every predictor pod of this
      # runtime; the defaults let KServe's Prometheus scraping find vLLM's
      # /metrics.
      annotations:  # @schema type: object; additionalProperties: true
        prometheus.kserve.io/path: /metrics
        prometheus.kserve.io/port: "8080"
      # Model formats this runtime serves. KServe matches an InferenceService
      # whose modelFormat.name is listed here (autoSelect) or that names the
      # runtime explicitly.
      supportedModelFormats:  # @schema item: object; itemProperties: {name: {type: string}, version: {type: string}, autoSelect: {type: boolean}, priority: {type: integer}}
        - name: vLLM
          version: "1"
          autoSelect: true
          priority: 1
      # Scheduling of every predictor pod of this runtime (the GPU nodes).
      nodeSelector: {}  # @schema type: object; additionalProperties: true
      tolerations: []  # @schema itemRef: $k8s/toleration.json
    # Defaults for every InferenceService the portal (backstage#2193) or
    # model-manager creates from a preset. Published in the discovery
    # ConfigMap; the chart itself creates no InferenceService.
    serving:
      # The extended resource a GPU is requested as (NVIDIA device plugin).
      gpuResourceName: nvidia.com/gpu
      # RuntimeClass of the predictor pods, e.g. nvidia for the NVIDIA
      # container toolkit; empty leaves the cluster default.
      runtimeClassName: ""
      # Node selector of every predictor pod, e.g. the GPU node pool; a
      # preset's scheduling.nodeSelector is merged on top.
      nodeSelector: {}  # @schema type: object; additionalProperties: true
      # Deployment strategy of the predictor: Recreate frees the GPU memory
      # of the old pod before the new one loads the model, which a node
      # whose memory is shared between GPU and CPU (unified memory) needs.
      deploymentStrategyType: Recreate  # @schema enum:[Recreate,RollingUpdate]
      # Request timeout KServe writes into the predictor's route. Long
      # reasoning turns stream for minutes; the KServe default of 60s cuts
      # them mid-response.
      timeoutSeconds: 1800
    # Serving presets an install adds (ServingPreset documents, see
    # files/model-serving/serving-preset.schema.json and the README). A
    # preset with the name of a shipped one replaces it. Example:
    #   presets:
    #     - apiVersion: agent-platform.giantswarm.io/v1alpha1
    #       kind: ServingPreset
    #       metadata:
    #         name: my-model
    #       spec:
    #         displayName: My model
    #         model:
    #           id: org/My-Model
    #           storageUri: hf://org/My-Model
    #         args: [--max-model-len=8192]
    #         resources:
    #           gpus: 1
    #         requirements:
    #           weightsGiB: 16
    presets: []  # @schema itemRef: files/model-serving/serving-preset.schema.json
    # The presets shipped with the chart (files/model-serving/presets/).
    # enabled: false drops the whole set; exclude drops single ones by name.
    shippedPresets:
      enabled: true
      exclude: []  # @schema item: string
    # Hugging Face model cache: one PVC in the serving namespace with one
    # subdirectory per InferenceService, so a model downloads once and every
    # restart finds it (hours to seconds). The PVC is kept on uninstall
    # (helm.sh/resource-policy: keep). Without the Kyverno policies below the
    # PVC is still created and published for model-manager's pre-warm
    # downloads, but the KServe storage-initializer downloads into its
    # ephemeral volume on every start.
    cache:
      enabled: true
      pvc:
        # Claim name, also the name published to the portal and
        # model-manager.
        name: hf-cache
        # A pre-existing claim in the serving namespace to use instead;
        # set, no PVC is rendered.
        existingClaim: ""
        size: 500Gi
        # Empty uses the cluster's default StorageClass; "-" sets an empty
        # class (static binding to a pre-provisioned PersistentVolume, e.g.
        # local NVMe on the GPU node).
        storageClassName: ""
        # Bind this claim to a specific pre-provisioned PersistentVolume.
        volumeName: ""
        accessModes:  # @schema item: string
          - ReadWriteOnce
    # Kyverno ClusterPolicies for the InferenceService pods and Deployments
    # in the serving namespace. Needs Kyverno on the cluster; off by default
    # because Kyverno is not a chart prerequisite. On, every predictor pod
    # gets: an init container that creates the pod's cache subdirectory
    # (<claim>/<inferenceservice>) world-writable before the KServe
    # storage-initializer runs (the kubelet creates a missing subPath
    # directory root-owned 0750, which the storage-initializer's uid cannot
    # write), the storage-initializer's and the runtime's /mnt/models
    # redirected into that subdirectory, and a storage-initializer memory
    # limit that survives multi-GB downloads; the Deployment gets a
    # progressDeadlineSeconds long enough for a first download. Nothing to
    # do on the node by hand.
    policies:
      enabled: false
      # The init container that prepares the cache subdirectory (runs as
      # root: the PVC root is root-owned).
      cacheInit:
        image:
          registry: gsoci.azurecr.io
          name: giantswarm/alpine
          # registry: gsoci.azurecr.io/giantswarm/alpine
          version: "3.22.1"
        resources:
          requests:  # @schema type: object; additionalProperties: true
            cpu: 10m
            memory: 16Mi
          limits:  # @schema type: object; additionalProperties: true
            cpu: 100m
            memory: 64Mi
      # Memory limit of the KServe storage-initializer init container. The
      # KServe default (1Gi) is OOM-killed by the Hugging Face download of a
      # large model. Empty leaves KServe's default.
      storageInitializerMemoryLimit: 4Gi
      # progressDeadlineSeconds of every InferenceService Deployment. The
      # Kubernetes default (600) is shorter than a first model download and
      # fires rollout-stuck alerts; 0 leaves the default.
      progressDeadlineSeconds: 3600
    # Network policies of the serving namespace, rendered under
    # global.networkPolicy (enabled + flavor) like every other component's
    # wiring: nothing renders while global.networkPolicy.enabled is false.
    # On, both flavors get: ingress to the predictor pods (every pod KServe
    # runs for an InferenceService, label serving.kserve.io/inferenceservice)
    # on the runtime port from the kagent agent pods, the release namespace
    # and predictor.additionalIngressNamespaces; egress from the predictor
    # pods (the storage-initializer download, the runtime) and from
    # model-manager's pre-warm download Jobs to DNS and the Hugging Face
    # endpoints below. The cilium flavor also admits the kubelet's probes
    # (host entity) — under policyEnforcementMode always a policy without
    # that rule kills the predictor before it turns Ready — and adds the
    # agent-side egress to the predictor pods (the chart's agent egress
    # covers 443 only). See the README, "Model serving" → "Network policies".
    networkPolicy:
      predictor:
        # The port the runtime container listens on (the
        # ClusterServingRuntime above: 8080); a preset that names another
        # runtime with another port changes it here.
        port: 8080
        # Namespaces whose pods may reach the predictor pods on that port,
        # besides the kagent agent pods and the release namespace: e.g. the
        # namespace of the KServe ingress Gateway (envoy-gateway-system) or
        # of Prometheus (KServe's scrape annotations point at the same port).
        additionalIngressNamespaces: []  # @schema item: string
      # Where the weights come from, TCP 443: the KServe storage-initializer
      # (hf:// presets), the runtime's own Hub lookups, model-manager's
      # pre-warm download Jobs and — on the kserve backend — model-manager
      # itself (Hub search, fit checks).
      huggingFace:
        # cilium flavor: Cilium FQDN selectors (matchName, matchPattern),
        # enforced through the DNS proxy rule the policies render on their
        # DNS egress; the defaults cover huggingface.co, its API redirects
        # and the LFS / Xet download fronts under hf.co (Cilium's * matches
        # one label, hence the two-level pattern for cas-bridge.xethub.hf.co).
        # A mirror (HF_ENDPOINT) or an internal proxy replaces the list.
        # Ignored by the kubernetes flavor, which cannot select names (see
        # cidrs).
        fqdns:  # @schema item: object; itemProperties: {matchName: {type: string}, matchPattern: {type: string}}
          - matchName: huggingface.co
          - matchPattern: "*.huggingface.co"
          - matchPattern: "*.hf.co"
          - matchPattern: "*.*.hf.co"
        # IP blocks of the download endpoints. kubernetes flavor: vanilla
        # NetworkPolicy selects addresses, never names, so an empty list (the
        # default) opens 443 to every public destination — 0.0.0.0/0 minus
        # global.networkPolicy.kubernetes.worldExcludedCIDRs, the data
        # plane's own rule — because Hugging Face's download fronts are CDNs
        # whose addresses change and a static list would break downloads
        # silently. A list here narrows the egress to exactly these blocks
        # (a mirror, a proxy, an S3 endpoint). The cilium flavor adds them
        # next to the FQDNs. global.networkPolicy.additionalEgressCIDRs and
        # additionalEgressFQDNs apply to both flavors as well.
        cidrs: []  # @schema item: string

  # The KServe control plane the modelServing component and model-manager's
  # kserve backend run on: the KServe CRDs (kserve-crd) and the controller
  # with its admission webhooks (kserve-resources), two dependencies switched
  # together by this one toggle (ADR 2026-09-02 "KServe bundled optionally",
  # revising decision D1 of the Model Manager PDR). Off by default and inert
  # while off; an install that already runs KServe leaves it off. The
  # controller runs in the release namespace, in Standard mode (plain
  # Deployments and Services per InferenceService; no Knative, no Istio);
  # its values are the dependency block kserve-resources below.
  #
  # First install is two-phase: KServe's CRDs and webhook must exist before a
  # ClusterServingRuntime or InferenceService can be created, and Helm applies
  # a release in one pass — so turn this on first (with modelServing and a
  # kserve-backend model-manager still off), then enable those in a second
  # upgrade. The render fails with that instruction otherwise.
  #
  # CRDs are part of the release: `helm upgrade` upgrades them (unlike a
  # chart's crds/ directory), and kserve-crd annotates them
  # helm.sh/resource-policy: keep, so an uninstall or a later enabled: false
  # leaves the CRDs and every InferenceService on the cluster.
  kserve:
    enabled: false
    certManager:
      # KServe's webhook certificates come from a cert-manager self-signed
      # Issuer + Certificate and the CA is injected by cert-manager, so
      # cert-manager is a prerequisite this chart does not install. Fail the
      # render while the cert-manager.io/v1 API is missing (an offline
      # `helm template` passes with --api-versions cert-manager.io/v1);
      # false skips the check.
      requireApi: true
    # The llm-d control plane: the LLMInferenceService controller
    # (kserve-llmisvc-resources), for multi-node and disaggregated serving
    # through KServe's LLMInferenceService CRD (inference-direction PDR
    # 2026-09-02). Needs the kserve component: the controller reads its
    # inferenceservice-config and shares its certificate Issuer. Controller
    # values: the dependency block kserve-llmisvc-resources below.
    #
    # The LLMInferenceService CRDs are a prerequisite this chart does not
    # install — chart kserve-llmisvc-crd, into the RELEASE namespace, where
    # the controller and the conversion webhook the CRDs point at run:
    #   helm install kserve-llmisvc-crd oci://gsoci.azurecr.io/charts/giantswarm/kserve-llmisvc-crd -n <release namespace>
    # Bundling them was measured and rejected: 4.5 MB of CRD YAML adds
    # ~370 KiB to the Helm release Secret, which then sits at ~880 KiB of
    # its 1 MiB cap with the rest of the platform.
    llmisvc:
      enabled: false
      # Fail the render while the prerequisites are missing: the
      # LLMInferenceService CRDs (above), and the Gateway API Inference
      # Extension CRDs (InferencePool, ...) the controller needs — shipped by
      # the controller chart when
      # kserve-llmisvc-resources.kserve.llmisvc.createGIECRDs is true, which
      # Helm cannot do when a cluster has them already (an inference gateway
      # installed them; set it false then). An offline `helm template` passes
      # with --api-versions serving.kserve.io/v1alpha2/LLMInferenceService
      # (and --api-versions inference.networking.k8s.io/v1 when createGIECRDs
      # is false); false skips the checks.
      requireApi: true

ingress:
  # The full-platform default topology: client -> agentgateway /mcp -> muster,
  # matching the fleet (agentgateway is the observability choke point for
  # every MCP call). muster-direct stays supported for trimmed installs that
  # set components.agentgateway.enabled: false.
  mode: agentgateway-muster
  httpRoute:
    # Portable stream timeout on the umbrella-owned routes (muster `/`, the
    # agentgateway `/mcp`, the kagent routes): `0s` asks the implementation to
    # disable the request timeout so MCP/SSE streams stay open. Envoy-specific
    # policies stay opt-in under ingress.backendTrafficPolicy.
    timeouts:
      request: "0s"

gateway:
  parameters:
    # OTEL env comes from global.observability.traces.otlp; this list is for
    # extra data-plane env only. The fleet default points at the Giant Swarm
    # otlp-gateway, which a standalone cluster does not run.
    dataPlaneEnv: []

# The default ingress.mode above is agentgateway-muster; the guard in
# _helpers.tpl requires the two to agree whenever agent-platform-mcps is on.
agent-platform-mcps:
  agentgateway:
    viaMuster: true

# The bundled Kubernetes MCP server (registered with muster by
# templates/mcp-kubernetes/mcpserver.yaml). The pinned Service name keeps the
# in-cluster MCPServer URL stable regardless of the release name.
#
# The user's identity, not a ServiceAccount: the server runs as an OAuth 2.1
# resource server (mcp-oauth) against the platform IdP. Its issuer, client,
# secret and CA fall back to the umbrella's global.identity contract inside
# the mcp-kubernetes chart (chart >= 1.1.1), the trusted audience to the
# platform client — muster forwards the session's IdP id_token
# (templates/mcp-kubernetes/mcpserver.yaml, auth.forwardToken) and the server
# validates it against the IdP's JWKS. enableDownstreamOAuth presents that
# token to the kube-apiserver, so every call runs with the user's RBAC (the
# chart then grants the ServiceAccount nothing). The two private-IP
# relaxations are for the platform's in-cluster Dex (discovery and JWKS
# resolve to cluster addresses); Google needs neither and ignores them.
mcp-kubernetes:
  fullnameOverride: mcp-kubernetes
  mcpKubernetes:
    oauth:
      enabled: true
      provider: dex
      allowPrivateURLs: true
      sso:
        allowPrivateIPs: true
      enableDownstreamOAuth: true

# Values forwarded to the agent-manager chart (components.agent-manager above
# is the umbrella's wiring). fullnameOverride is what the umbrella's route and
# network policies target; kagent.namespace must equal the kagent component's
# namespace (validate.yaml); the MCPServer CR registers the tools with muster.
agent-manager:  # @schema skipProperties: true; additionalProperties: true
  fullnameOverride: agent-manager
  kagent:
    namespace: kagent
  # The agent chart every agent renders from, and the range the shared
  # OCIRepository tracks (x.x.x: every release — the platform convention).
  agentChart:
    ociUrl: oci://gsoci.azurecr.io/charts/giantswarm/agent
    semver: x.x.x
  # The skill repositories list_skills offers: keep in step with
  # components.backstage.skillsRepositories (the portal's create flow reads
  # the same repositories).
  skills:
    repositories:
      - https://github.com/giantswarm/agent-skills
  mcp:
    enabled: true
  muster:
    mcpServer:
      enabled: true
  # The umbrella renders the network policies for this component under
  # global.networkPolicy (templates/agent-manager/netpol.yaml), in both
  # flavors; the chart's own NetworkPolicy stays off.
  networkPolicy:
    enabled: false


# The model-manager dependency's own values (components.model-manager turns
# it on; the umbrella wiring — route, JWT policy, network policies — is under
# components.model-manager). The pinned Service name keeps the in-cluster
# MCPServer URL and the AgentgatewayBackend host stable regardless of the
# release name (the umbrella templates read it, like muster.fullnameOverride).
# `backend` selects the serving driver: `ollama` proxies a host Ollama (the
# laptop / agentlab dev loop; `ollama.endpoint` as reached from pods is
# REQUIRED — on kind the docker network gateway, e.g.
# http://172.21.0.1:11434 — and `ollama.agentHost` is what agent pods dial
# when it differs), `kserve` manages InferenceServices on the modelServing
# component's KServe: kserve.namespace must equal
# components.modelServing.namespace.name, and the runtime, GPU resource
# name, cache claim and preset selector are read at run time from the
# modelServing discovery ConfigMap (kserve.discovery.configMap, the umbrella's
# agent-platform-model-serving in the release namespace) — an install that
# turns on both components configures the serving layer once; a kserve.*
# override that disagrees with components.modelServing fails the render.
# ModelConfigs are
# wired into kagent.namespace, which must be the kagent component's namespace
# (kagent.kagent.namespaceOverride); an install without the kagent component
# sets kagent.disableWiring: true. The MCP endpoint is registered with muster
# through the chart's own MCPServer CR (muster.mcpServer.enabled — the muster
# component must be on for the CRD to exist), tools appear as
# x_model-manager_<tool>. Image, resources and the rest are the chart's
# defaults (see its README).
#
# The user's identity, not a ServiceAccount (chart >= 0.13.0): oauth.enabled
# makes model-manager an OAuth 2.1 resource server (mcp-oauth) in front of
# both its MCP endpoint and its REST API — issuer, client, secret and CA fall
# back to global.identity inside the chart, the trusted audience to the
# platform client; the OAuth base URL derives from global.domain. muster
# forwards the session's IdP id_token (the MCPServer CR's auth block,
# muster.mcpServer.auth) and the portal sends the user's id_token through the
# gateway route; model-manager validates both against the IdP's JWKS and
# logs every mutation with the caller (jobs carry requestedBy).
# oauth.downstream presents that token to the kube-apiserver for everything
# a request does (InferenceServices, download Jobs, cache scans,
# ModelConfigs) — the user's RBAC governs and the ServiceAccount gets no
# RBAC at all (chart >= 0.14.0 renders none; the paths without a caller,
# download re-adoption and the wiring reconciler, are off; a job outliving
# its caller's token fails on the apiserver's 401). requiredAudiences is the cross-client
# audience the apiserver trusts (see components.mcp-kubernetes
# .kubernetesAudience — a Google IdP sets []); the private-IP relaxations
# are for the platform's in-cluster Dex.
model-manager:
  fullnameOverride: model-manager
  backend: ollama
  ollama:
    endpoint: ""
    agentHost: ""
  kagent:
    namespace: kagent
    disableWiring: false
  kserve:
    namespace: model-serving
    discovery:
      configMap: agent-platform-model-serving
      namespace: ""
  mcp:
    enabled: true
  oauth:
    enabled: true
    provider: dex
    dex:
      allowPrivateURLs: true
    sso:
      allowPrivateIPs: true
    downstream:
      enabled: true
  muster:
    mcpServer:
      enabled: true
      auth:
        forwardToken: true
        requiredAudiences:
          - dex-k8s-authenticator
  # The umbrella renders the network policies for this component under
  # global.networkPolicy (templates/model-manager/netpol.yaml), in both
  # flavors; the chart's own NetworkPolicy stays off.
  networkPolicy:
    enabled: false

# The KServe controller chart (components.kserve turns it on, together with
# kserve-crd). Everything not set here is the chart's default: the upstream
# multi-arch kserve/kserve-controller image at the KServe version the chart
# vendors, the storage-initializer, the webhook certificates through
# cert-manager. The umbrella renders the controller's network policies
# (templates/kserve/netpol.yaml) under global.networkPolicy.
kserve-resources:
  kserve:
    controller:
      # Plain Deployments and Services per InferenceService ("Standard", the
      # former RawDeployment). The Knative and ModelMesh modes need
      # controllers this chart does not ship; the render fails on them.
      deploymentMode: Standard
      gateway:
        # No per-model Ingress or HTTPRoute: agents and the platform reach a
        # model through its predictor Service (<name>-predictor.<namespace>),
        # which is what the portal and model-manager wire into kagent. An
        # install that wants external per-model routes sets this false and
        # the gateway domain / ingressGateway.* of the chart.
        disableIngressCreation: true

# The LLMInferenceService (llm-d) controller chart
# (components.kserve.llmisvc.enabled turns it on).
kserve-llmisvc-resources:
  kserve:
    # kserve-resources renders the shared objects (the inferenceservice-config
    # ConfigMap, the self-signed Issuer, the default ClusterStorageContainer);
    # a second copy in the same release would conflict. Guarded.
    createSharedResources: false
    llmisvc:
      # Ship the Gateway API Inference Extension CRDs (InferencePool, ...)
      # with the controller. A cluster that already has them (an inference
      # gateway installed them) sets this false: Helm cannot adopt them.
      createGIECRDs: true

kagent:
  kagent:
    oauth2-proxy:
      # The oauth2-proxy chart renders extraArgs through tpl against its own
      # root, which carries the umbrella's global.* block.
      #
      # redirect-url always derives from global.domain: the oauth2-proxy
      # subchart cannot see components.kagent.uiRoute.hostname, so an override
      # of that hostname must override redirect-url here too, or the callback
      # lands on the derived kagent.<global.domain>.
      extraArgs:
        oidc-issuer-url: "{{ .Values.global.identity.issuerUrl }}"
        client-id: "{{ .Values.global.identity.clientId }}"
        redirect-url: "https://kagent.{{ .Values.global.domain }}/oauth2/callback"
      extraEnv:
        - name: UPSTREAM_URL
          value: http://kagent-ui:8080

# The Backstage chart's own Ingress is off; the umbrella renders the HTTPRoute
# and the app-config ConfigMap (templates/backstage/) from global.*.
backstage:
  ingress:
    enabled: false
  # No VPA object by default: the VerticalPodAutoscaler CRD is not part of
  # Kubernetes conformance, and the chart's promise is a plain helm install on
  # any conformant cluster. (The CI smoke never catches this: apptestctl
  # installs the VPA CRD on the ATS kind cluster.)
  resources:
    verticalPodAutoscaler:
      enabled: false
  backstage:
    # The image's base configuration, restated: any explicit --config replaces
    # Backstage's default config set, and the chart passes extraAppConfig as
    # --config flags — without these two the backend runs on the overlay
    # alone and the app plugin fails startup on schema keys only the base
    # config carries (e.g. `grafana`). Same flags as the image's own CMD.
    args:
      - --config
      - app-config.yaml
      - --config
      - app-config.production.yaml
    extraAppConfig:
      - filename: app-config.agent-platform.yaml
        configMapRef: agent-platform-backstage-app-config
    # Rendered through tpl against the backstage chart root, so the Secret
    # names follow global.identity. NODE_EXTRA_CA_CERTS stays empty (Node
    # ignores it) unless a private CA Secret is named, so Node does not warn
    # about a missing file on every start.
    extraEnvVars:
      - name: AUTH_SESSION_SECRET
        valueFrom:
          secretKeyRef:
            name: "{{ .Values.global.identity.existingSecret }}"
            key: backstage-session-secret
      - name: AGENT_PLATFORM_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: "{{ .Values.global.identity.existingSecret }}"
            key: dex-client-secret
      - name: NODE_EXTRA_CA_CERTS
        value: "{{ if .Values.global.identity.ca.secretName }}/etc/agent-platform/idp-ca/{{ .Values.global.identity.ca.key }}{{ end }}"
    extraVolumes:
      - name: idp-ca
        secret:
          secretName: "{{ .Values.global.identity.ca.secretName | default \"agent-platform-idp-ca\" }}"
          optional: true
    extraVolumeMounts:
      - name: idp-ca
        mountPath: /etc/agent-platform/idp-ca
        readOnly: true
