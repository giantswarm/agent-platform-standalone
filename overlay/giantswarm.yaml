# Per-installation inputs of the generated examples/giantswarm.yaml. The
# generator merges this file on top of the fleet defaults that
# overlay/vanilla.yaml turns off. Hostnames use example.gigantic.io; an
# installation replaces them with its own <mc>.<base-domain>.

global:
  domain: example.gigantic.io
  identity:
    issuerUrl: https://dex.example.gigantic.io
    clientId: agent-platform
    existingSecret: agent-platform-idp
  gatewayApi:
    parentRefs:
      - name: giantswarm-default
        namespace: envoy-gateway-system
  observability:
    metrics:
      serviceMonitor:
        enabled: true
        labels:
          observability.giantswarm.io/tenant: giantswarm
    traces:
      otlp:
        endpoint: http://otlp-gateway.kube-system.svc:4317
        headers:
          X-Scope-OrgID: giantswarm

components:
  kagent:
    enabled: true
    controllerRoute:
      enabled: true
  agentgateway:
    enabled: true
  agent-platform-mcps:
    enabled: true

ingress:
  mode: agentgateway-muster

muster:
  muster:
    oauth:
      server:
        baseUrl: https://muster.example.gigantic.io
        dex:
          issuerUrl: https://dex.example.gigantic.io
          clientId: agent-platform
        existingSecret: agent-platform-idp

valkey:
  valkey:
    auth:
      usersExistingSecret: agent-platform-idp

dicebear:
  route:
    parentRefs:
      - name: giantswarm-default
        namespace: envoy-gateway-system
    hostnames:
      - avatars.example.gigantic.io

agent-platform-mcps:
  agentgateway:
    viaMuster: true
