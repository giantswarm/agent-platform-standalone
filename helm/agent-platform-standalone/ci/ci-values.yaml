# Render-valid values for `ct lint` and the app-build-suite template validator
# (see .abs/main.yaml). The defaults alone do not render: the routes need a
# public Gateway (global.gatewayApi.parentRefs) and a domain, and muster's
# OAuth server rejects empty OIDC fields, all on purpose. Every component is on
# so the full render path is exercised; cloudnative-pg stays off because its
# chart requires kubeVersion >= 1.29 and `ct lint` templates against Helm's
# default version.
global:
  domain: ci.example.com
  identity:
    issuerUrl: https://dex.ci.example.com
    clientId: agent-platform
    existingSecret: agent-platform-idp
  gatewayApi:
    parentRefs:
      - name: giantswarm-default
        namespace: envoy-gateway-system

components:
  muster:
    enabled: true
  valkey:
    enabled: true
  kagent:
    enabled: true
    controllerRoute:
      enabled: true
  agentgateway:
    enabled: true
  agent-platform-mcps:
    enabled: true
  klaus-gateway:
    enabled: true
  dicebear:
    enabled: true
  agent-sandbox:
    enabled: true
  backstage:
    enabled: true
  cloudnative-pg:
    enabled: false
  model-manager:
    enabled: true
    route:
      enabled: true
      jwtAuthentication:
        enabled: true
  agent-manager:
    enabled: true
    route:
      enabled: true
      jwtAuthentication:
        enabled: true

ingress:
  mode: agentgateway-muster

gateway:
  # The model-manager route's JWT policy fetches the JWKS from dex on 5556.
  jwksEgress:
    enabled: true

muster:
  muster:
    oauth:
      server:
        baseUrl: https://muster.ci.example.com
        dex:
          issuerUrl: https://dex.ci.example.com
          clientId: agent-platform
        existingSecret: agent-platform-idp

valkey:
  valkey:
    auth:
      # The same Secret muster reads `valkey-password` from.
      usersExistingSecret: agent-platform-idp

dicebear:
  route:
    enabled: true
    parentRefs:
      - name: giantswarm-default
        namespace: envoy-gateway-system
    hostnames:
      - avatars.ci.example.com

agent-platform-mcps:
  agentgateway:
    viaMuster: true

# The model-manager service with the ollama backend: a host Ollama, as pods
# reach it (render-valid example address).
model-manager:
  ollama:
    endpoint: http://192.0.2.10:11434
