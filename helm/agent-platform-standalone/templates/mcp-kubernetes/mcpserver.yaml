{{- /*
Registers the bundled mcp-kubernetes server with muster. The Service name is
pinned by mcp-kubernetes.fullnameOverride (overlay/contract.yaml) so the URL
survives any release name; the port follows the mcp-kubernetes chart's
service.port.

With the server's OAuth on (mcp-kubernetes.mcpKubernetes.oauth.enabled, the
umbrella default) the CR carries the auth block: muster forwards the
session's IdP id_token byte-identical (forwardToken — the server validates it
against the IdP's JWKS, trusting the platform client's audience) and requests
components.mcp-kubernetes.kubernetesAudience at login so the token is also
valid at the kube-apiserver (enableDownstreamOAuth). With OAuth off muster
connects anonymously and the server acts as its ServiceAccount.
*/ -}}
{{- if and (include "agent-platform-standalone.componentEnabled" (dict "root" $ "name" "mcp-kubernetes")) (include "agent-platform-standalone.componentEnabled" (dict "root" $ "name" "muster")) }}
{{- $mcpk := index .Values "mcp-kubernetes" | default dict }}
{{- $oauthOn := dig "mcpKubernetes" "oauth" "enabled" false $mcpk }}
{{- $component := index .Values.components "mcp-kubernetes" | default dict }}
apiVersion: muster.giantswarm.io/v1alpha1
kind: MCPServer
metadata:
  name: mcp-kubernetes
  namespace: {{ .Release.Namespace }}
  labels:
    muster.giantswarm.io/type: mcp-kubernetes
    {{- include "agent-platform-standalone.labels.common" . | nindent 4 }}
spec:
  autoStart: true
  type: streamable-http
  url: http://{{ dig "fullnameOverride" "mcp-kubernetes" $mcpk }}.{{ .Release.Namespace }}.svc.cluster.local:{{ dig "service" "port" 8080 $mcpk }}/mcp
  {{- if $oauthOn }}
  auth:
    type: oauth
    forwardToken: true
    {{- with (dig "kubernetesAudience" "" $component) }}
    requiredAudiences:
      - {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
