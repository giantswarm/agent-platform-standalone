{{- /*
Render-time guards for the kagent / postgres wiring. These fail `helm template`
(and therefore CI lint + install) early with an actionable message instead of
producing a silently-broken release.
*/ -}}
{{- if .Values.components.kagent.enabled }}
  {{- $kagentNs := .Values.kagent.kagent.namespaceOverride | default .Release.Namespace }}

  {{- /* An HTTPRoute with no hostname on the shared public Gateway matches ALL
         traffic to that Gateway and forwards it to the kagent UI/oauth2-proxy.
         The hostname helper fails the render when neither the override nor
         global.domain is set. */ -}}
  {{- if .Values.components.kagent.uiRoute.enabled }}
    {{- $_ := include "agent-platform.hostname" (dict "ctx" . "prefix" "kagent" "override" .Values.components.kagent.uiRoute.hostname "key" "components.kagent.uiRoute.hostname") }}
  {{- end }}
  {{- if .Values.components.kagent.controllerRoute.enabled }}
    {{- $_ := include "agent-platform.hostname" (dict "ctx" . "prefix" "agentgateway" "override" .Values.components.kagent.controllerRoute.hostname "key" "components.kagent.controllerRoute.hostname") }}
  {{- end }}

  {{- /* A JWT policy without an issuer validates nothing dex-shaped. */ -}}
  {{- if and .Values.components.kagent.controllerRoute.enabled ((.Values.components.kagent.controllerRoute.jwtAuthentication).enabled) }}
    {{- $_ := include "agent-platform.issuerUrl" (dict "ctx" . "for" "components.kagent.controllerRoute.jwtAuthentication (or set its .issuer)") }}
  {{- end }}

  {{- /* The data plane can only fetch the JWKS from dex on 5556 when jwksEgress
         is on; without it Strict/Optional validation fails closed on every token. */ -}}
  {{- if and .Values.components.kagent.controllerRoute.enabled ((.Values.components.kagent.controllerRoute.jwtAuthentication).enabled) (not .Values.gateway.jwksEgress.enabled) }}
    {{- fail "kagent.controllerRoute.jwtAuthentication.enabled is true but gateway.jwksEgress.enabled is false. The agentgateway data plane cannot reach dex on 5556 to fetch the JWKS, so signature validation fails closed. Set gateway.jwksEgress.enabled: true." }}
  {{- end }}

  {{- /* The CNPG-generated DSN Secret lands in the Cluster's namespace; kagent
         mounts it by name, so the two namespaces must match. */ -}}
  {{- if .Values.postgres.enabled }}
    {{- $pgNs := .Values.postgres.namespace | default .Release.Namespace }}
    {{- if ne $pgNs $kagentNs }}
      {{- fail (printf "postgres.namespace (%s) must equal kagent.namespaceOverride (%s) so the CNPG-generated DSN Secret is co-located with the kagent controller that mounts it." $pgNs $kagentNs) }}
    {{- end }}
  {{- end }}
{{- end }}
