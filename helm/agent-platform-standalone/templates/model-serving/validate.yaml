{{- /*
Render-time guards of the modelServing component. They fail `helm template`
(and therefore CI lint + install) with an actionable message instead of
shipping objects the API server rejects or a preset the portal cannot use.
*/ -}}
{{- if (include "agent-platform-standalone.modelServing.enabled" .) }}
  {{- $ms := .Values.components.modelServing }}
  {{- /* KServe comes from the kserve component or from the cluster. Helm
         fills .Capabilities.APIVersions from the cluster on install/upgrade,
         so a missing serving.kserve.io API is a missing KServe; an offline
         `helm template` has to be told with --api-versions. With the kserve
         component on, templates/kserve/validate.yaml owns this check (a
         missing API is then the two-phase first install). */ -}}
  {{- if and $ms.kserve.requireApi (not (include "agent-platform-standalone.kserve.enabled" .)) }}
    {{- if not (include "agent-platform-standalone.kserve.apiPresent" .) }}
      {{- fail "components.modelServing.enabled is true but the KServe CRDs (serving.kserve.io/v1alpha1 ClusterServingRuntime, serving.kserve.io/v1beta1 InferenceService) are not on the cluster. Turn on components.kserve (the chart's KServe control plane; README, section KServe control plane) or install KServe first. For an offline render pass --api-versions serving.kserve.io/v1alpha1 --api-versions serving.kserve.io/v1beta1, or set components.modelServing.kserve.requireApi=false to skip this check." }}
    {{- end }}
  {{- end }}
  {{- if not $ms.runtime.name }}
    {{- fail "components.modelServing.runtime.name is empty: the ClusterServingRuntime needs a name, and every preset without a runtime of its own runs on it" }}
  {{- end }}
  {{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $ms.runtime.name) }}
    {{- fail (printf "components.modelServing.runtime.name (%q) must be a lowercase DNS-1123 label" $ms.runtime.name) }}
  {{- end }}
  {{- if and $ms.cache.enabled (not $ms.cache.pvc.existingClaim) (not $ms.cache.pvc.name) }}
    {{- fail "components.modelServing.cache.pvc.name is empty: name the cache claim, or set cache.pvc.existingClaim" }}
  {{- end }}
  {{- /* Every preset in effect must resolve: the helpers fail on a bad name,
         a missing required field or an unresolvable chat template. */ -}}
  {{- $presets := include "agent-platform-standalone.modelServing.presets" . | fromJson }}
  {{- range $name, $entry := $presets }}
    {{- $_ := include "agent-platform-standalone.modelServing.resolvePreset" (dict "root" $ "name" $name "entry" $entry) }}
  {{- end }}
  {{- /* The network-policy inputs, checked only while the policies render
         (global.networkPolicy.enabled): a typo would otherwise ship a
         selector that matches nothing or an object the API server rejects. */ -}}
  {{- if .Values.global.networkPolicy.enabled }}
    {{- $np := $ms.networkPolicy }}
    {{- $port := int $np.predictor.port }}
    {{- if or (lt $port 1) (gt $port 65535) }}
      {{- fail (printf "components.modelServing.networkPolicy.predictor.port (%v) must be a TCP port (1-65535): the port the runtime container listens on" $np.predictor.port) }}
    {{- end }}
    {{- range $i, $n := $np.predictor.additionalIngressNamespaces }}
      {{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (toString $n)) }}
        {{- fail (printf "components.modelServing.networkPolicy.predictor.additionalIngressNamespaces[%d] (%q) must be a namespace name (lowercase DNS-1123 label)" $i (toString $n)) }}
      {{- end }}
    {{- end }}
    {{- range $i, $f := $np.huggingFace.fqdns }}
      {{- if not (kindIs "map" $f) }}
        {{- fail (printf "components.modelServing.networkPolicy.huggingFace.fqdns[%d] must be a mapping with matchName or matchPattern (a Cilium FQDN selector)" $i) }}
      {{- end }}
      {{- $matchName := get $f "matchName" | default "" }}
      {{- $matchPattern := get $f "matchPattern" | default "" }}
      {{- if or (ne (len (keys $f)) 1) (not (or $matchName $matchPattern)) }}
        {{- fail (printf "components.modelServing.networkPolicy.huggingFace.fqdns[%d] must be exactly one of matchName or matchPattern, non-empty (a Cilium FQDN selector)" $i) }}
      {{- end }}
    {{- end }}
    {{- range $i, $c := $np.huggingFace.cidrs }}
      {{- if not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$|^[0-9a-fA-F:]+/[0-9]{1,3}$" (toString $c)) }}
        {{- fail (printf "components.modelServing.networkPolicy.huggingFace.cidrs[%d] (%q) must be a CIDR, e.g. 203.0.113.0/24" $i (toString $c)) }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
