{{- /*
Render-time guard for the agent-sandbox pod-security wiring. Fails `helm template`
(and therefore CI lint + install) early with an actionable message instead of
producing a silently-broken release.

Two failures are guarded here.

FIRST: the policy must exist at all. kyvernoPolicies.enabled: false drops it, and
the upstream controller chart exposes no securityContext knob, so the Deployment
then carries no securityContext from anywhere and PSA rejects it. Turning
components.agent-sandbox.podSecurity.enabled off is the explicit way to accept that.

SECOND: the policy must match. It targets the controller Deployment by namespace
via components.agent-sandbox.podSecurity.namespace. That value is independent of
the namespace the agent-sandbox subchart actually deploys into
(agent-sandbox.agent-sandbox.namespace.name). If the two drift, the policy never
matches, the controller pod ships without the restricted-PSS securityContext, and
PSA silently rejects it. Keep them in lockstep.
*/ -}}
{{- if and (include "agent-platform-standalone.componentEnabled" (dict "root" $ "name" "agent-sandbox")) (index .Values.components "agent-sandbox").podSecurity.enabled }}
  {{- if not .Values.kyvernoPolicies.enabled }}
    {{- fail "components.agent-sandbox.podSecurity.enabled requires kyvernoPolicies.enabled: the securityContext reaches the controller Deployment through the Kyverno mutate policy and through nothing else. Set components.agent-sandbox.podSecurity.enabled: false to run the controller without a securityContext (only safe where nothing enforces restricted PSS), or components.agent-sandbox.enabled: false." }}
  {{- end }}
  {{- $controllerNs := "agent-sandbox-system" }}
  {{- $sandbox := index .Values "agent-sandbox" }}
  {{- if $sandbox }}
    {{- $inner := index $sandbox "agent-sandbox" }}
    {{- if and $inner $inner.namespace $inner.namespace.name }}
      {{- $controllerNs = $inner.namespace.name }}
    {{- end }}
  {{- end }}
  {{- if ne (index .Values.components "agent-sandbox").podSecurity.namespace $controllerNs }}
    {{- fail (printf "components.agent-sandbox.podSecurity.namespace (%s) must equal the agent-sandbox controller namespace (%s, from agent-sandbox.agent-sandbox.namespace.name). The first drives the Kyverno pod-security policy's target namespace, the second the controller Deployment's namespace; if they differ the policy never matches and the controller pod is rejected by PSA." (index .Values.components "agent-sandbox").podSecurity.namespace $controllerNs) }}
  {{- end }}
{{- end }}
