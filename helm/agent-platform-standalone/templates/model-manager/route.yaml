{{- if and (include "agent-platform-standalone.modelManager.enabled" .) (index .Values.components "model-manager").route.enabled }}
{{- $route := (index .Values.components "model-manager").route }}
{{- $fullname := include "agent-platform-standalone.modelManager.fullname" . }}
# AgentgatewayBackend — registers the model-manager Service as a backend that
# agentgateway can proxy to after JWT validation.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: model-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform-standalone.modelManager.labels" . | nindent 4 }}
spec:
  policies:
    auth:
      # Gateway strips the JWT after validation; passthrough re-injects it so
      # the backend sees the caller's token (model-manager checks no identity
      # today — the gateway policy is the boundary — but a later version may
      # read claims).
      passthrough: {}
  static:
    host: {{ printf "%s.%s.svc.cluster.local" $fullname .Release.Namespace }}
    port: {{ include "agent-platform-standalone.modelManager.servicePort" . }}
---
# HTTPRoute — exposes the model-manager API at <pathPrefix> on the agentgateway
# Gateway. The path prefix is stripped (URLRewrite) before forwarding so the
# service receives requests at /api/v1/... as it expects.
#
# This is the internal data-plane hop. Like the kagent controller route it is
# deliberately NOT hostname-scoped: an in-cluster caller dialing the
# agentgateway Service by its cluster-DNS name sends that as Host, which would
# not match the public hostname and fall through to the catch-all MCP route
# ("/"). The path prefix is more specific than "/", so a hostname-less route
# wins for every Host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: model-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform-standalone.modelManager.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Release.Namespace }}
      group: gateway.networking.k8s.io
      kind: Gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $route.pathPrefix }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: model-manager
          kind: AgentgatewayBackend
          group: agentgateway.dev
{{- if not (include "agent-platform-standalone.edgeIsDataPlane" .) }}
---
# HTTPRoute — exposes the model-manager API on the outer public Gateway
# (TLS-terminating). Forwards <pathPrefix>/* on the public hostname to the
# agentgateway Service, which then applies JWT validation and the inner
# URLRewrite before forwarding to model-manager. No URLRewrite here: the prefix
# strip happens at the inner hop only. Not rendered when the data plane is the
# edge itself: the inner route above then serves <pathPrefix> on the HTTPS
# listener directly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: model-manager-public
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform-standalone.modelManager.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- $override := list }}
    {{- if $route.parentRef.name }}
    {{- $override = list (dict "name" $route.parentRef.name "namespace" $route.parentRef.namespace "group" "gateway.networking.k8s.io" "kind" "Gateway") }}
    {{- end }}
    {{- include "agent-platform-standalone.parentRefs" (dict "ctx" . "override" $override "key" "components.model-manager.route.parentRef") | nindent 4 }}
  hostnames:
    - {{ include "agent-platform-standalone.modelManager.hostname" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $route.pathPrefix }}
      {{- with (include "agent-platform-standalone.routeTimeouts" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      backendRefs:
        - name: {{ .Values.gateway.name }}
          port: 8080
{{- end }}
{{- end }}
