{{- if .Values.components.backstage.enabled }}
{{- $backstage := .Values.components.backstage }}
# Public route to the Backstage Service (the backstage chart's own Ingress is
# off). The Service name and port are the backstage chart's `name` and `port`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform-standalone.labels.common" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "agent-platform-standalone.parentRefs" (dict "ctx" . "override" $backstage.parentRefs "key" "components.backstage.parentRefs") | nindent 4 }}
  hostnames:
    - {{ include "agent-platform-standalone.hostname" (dict "ctx" . "prefix" "backstage" "override" $backstage.hostname "key" "components.backstage.hostname") | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- with (include "agent-platform-standalone.routeTimeouts" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      backendRefs:
        - name: {{ dig "name" "backstage" (.Values.backstage | default dict) }}
          port: {{ dig "port" 7007 (.Values.backstage | default dict) }}
{{- end }}
