# kind quick start: the chart's agentgateway Gateway is the public edge, a lab
# Dex is the identity provider.
#
#   kubectl apply -f prerequisites/lab-dex.yaml          # a later slice
#   helm dependency build helm/agent-platform-standalone
#   helm install agent-platform helm/agent-platform-standalone -n agent-platform \
#     --create-namespace -f examples/kind-lab-dex.yaml
#
# LAB ONLY. The lab Dex (static password users, no upstream connector), the
# self-signed wildcard certificate and the Secrets below come from
# prerequisites/lab-dex.yaml. Never a production path.
#
# Prerequisites on the cluster: Gateway API CRDs; in the release namespace the
# Secret `agent-platform-idp` (dex-client-secret, registration-token,
# oauth-encryption-key, valkey-password, backstage-session-secret), the
# wildcard certificate Secret `agent-platform-tls` and the lab CA Secret
# `agent-platform-idp-ca` (key ca.crt); DNS for *.127.0.0.1.nip.io (the nip.io
# wildcard resolves to localhost).

global:
  domain: 127.0.0.1.nip.io
  identity:
    issuerUrl: https://dex.127.0.0.1.nip.io
    clientId: agent-platform
    existingSecret: agent-platform-idp
    ca:
      secretName: agent-platform-idp-ca

gatewayApi:
  gateway:
    create: true
    tls:
      secretName: agent-platform-tls

components:
  muster:
    enabled: true
  valkey:
    enabled: true
  kagent:
    enabled: true
    controllerRoute:
      enabled: true
  agentgateway:
    enabled: true
  agent-platform-mcps:
    enabled: true
  backstage:
    enabled: true
  klaus-gateway:
    enabled: false
  agent-sandbox:
    enabled: false
  cloudnative-pg:
    enabled: false

# client -> agentgateway /mcp -> muster
ingress:
  mode: agentgateway-muster

# The muster chart reads its own OIDC keys; they must match global.identity
# (the render fails otherwise).
muster:
  muster:
    oauth:
      server:
        baseUrl: https://muster.127.0.0.1.nip.io
        dex:
          issuerUrl: https://dex.127.0.0.1.nip.io
          clientId: agent-platform
          # The lab Dex resolves to a private address.
          allowPrivateIPOIDC: true
        existingSecret: agent-platform-idp
    # The lab CA, for OIDC discovery and JWKS against the lab Dex.
    extraCaFile:
      secret:
        name: agent-platform-idp-ca
        key: ca.crt

valkey:
  valkey:
    auth:
      # The same Secret muster reads `valkey-password` from.
      usersExistingSecret: agent-platform-idp

agent-platform-mcps:
  agentgateway:
    viaMuster: true
