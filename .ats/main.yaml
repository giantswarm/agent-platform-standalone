# app-test-suite (ATS >= 1.0) config, consumed by the generated
# `run-tests-with-ats` CircleCI job (execute-chart-tests). The job creates the
# kind cluster and hands ATS its kubeconfig; helm and kubectl come with the
# ATS image.
#
# The smoke installs the chart itself (tests/ats/test_smoke.py): the chart
# needs cluster prerequisites first (Gateway API CRDs, prerequisites/
# lab-dex.yaml), so ATS's own pre-test deploy is skipped and the test runs
# `helm upgrade --install` on the candidate archive with
# examples/kind-lab-dex.yaml after preparing the cluster — the same order and
# the same Helm 4 CLI path the README quick start documents.
#
# The upgrade scenario is SKIPPED (issue #32): ATS installs the baseline
# (latest stable catalog release) before any cluster preparation runs, and
# since 0.2.0 the baseline is the full umbrella that cannot come up without
# the prerequisites. With ATS >= 1.0 all scenarios share the job's cluster, so
# the prerequisites the smoke applies persist; re-enabling needs the smoke
# release uninstalled first (a post-hook) so the baseline lands on a prepared,
# empty namespace with the values below. The wiring is kept for that moment.
#
# The functional step stays skipped: smoke covers install + auth, and there
# is no third scenario yet.
app-tests-app-config-file: examples/kind-lab-dex.yaml
app-tests-deploy-namespace: agent-platform
app-tests-skip-app-deploy: true

upgrade-tests-app-catalog-url: https://giantswarm.github.io/giantswarm-catalog
upgrade-tests-app-version: stable
upgrade-tests-app-config-file: examples/kind-lab-dex.yaml
upgrade-tests-upgrade-hook: tests/ats/upgrade-hook.sh

skip-steps: [functional, upgrade]
