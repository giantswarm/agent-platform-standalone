# app-test-suite config, consumed by the generated `run-tests-with-ats` CircleCI
# job (execute-chart-tests).
#
# The cluster test steps are skipped in this slice. The umbrella installs
# muster, kagent and agentgateway with their CRDs, but the render also needs
# the Gateway API CRDs and a lab Dex on the cluster, and the kind conftest that
# installs those prerequisites is a later slice. Until then the build-chart job
# (app-build-suite lint, template validation, schema) and the `verify` job in
# .circleci/custom.yml gate the PR.
app-tests-app-config-file: helm/agent-platform-standalone/ci/ci-values.yaml
app-tests-deploy-namespace: agent-platform

smoke-tests-cluster-type: kind

skip-steps: [smoke,functional,upgrade]
