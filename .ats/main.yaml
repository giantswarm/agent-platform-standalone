# app-test-suite config, consumed by the generated `run-tests-with-ats`
# CircleCI job (execute-chart-tests).
#
# The smoke installs the chart itself (tests/ats/test_smoke.py): the chart
# needs cluster prerequisites first (Gateway API CRDs, prerequisites/
# lab-dex.yaml), so ATS's own pre-test deploy is skipped and the test deploys
# the candidate from the in-cluster chartmuseum with
# examples/kind-lab-dex.yaml after preparing the cluster — the same order the
# README quick start documents.
#
# The upgrade scenario is SKIPPED (issue #32): ATS installs the baseline
# (latest catalog release) before any cluster preparation runs, and since
# 0.2.0 the baseline is the full umbrella that cannot come up without the
# prerequisites (lab-dex secret, Gateway API CRDs) — the App CR never
# converges and CI kills the silent wait after 10 minutes, which blocked
# every chart publish after 0.2.0. Re-enable once the baseline can install
# cleanly on a bare cluster or ATS can prepare the cluster first; the old
# scenario wiring (upgrade-tests-*) is kept below for that moment.
#
# The functional step stays skipped: smoke covers install + auth, and there
# is no third scenario yet.
app-tests-app-config-file: examples/kind-lab-dex.yaml
app-tests-deploy-namespace: agent-platform
app-tests-skip-app-deploy: true

smoke-tests-cluster-type: kind
upgrade-tests-cluster-type: kind

upgrade-tests-app-catalog-url: https://giantswarm.github.io/giantswarm-catalog
upgrade-tests-app-version: latest
upgrade-tests-upgrade-hook: tests/ats/upgrade-hook.sh

skip-steps: [functional, upgrade]
